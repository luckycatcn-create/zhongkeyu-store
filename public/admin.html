<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ONEWORLD — Admin</title>
<style>
  :root { --p:#0f4c81; --pd:#0a355c; --a:#f5a623; --ink:#1f2733; --mut:#6b7686; --line:#e6e9ef; --bg:#f6f8fb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
  .hidden { display:none !important; }
  #login { position:fixed; inset:0; background:rgba(10,53,92,.85); display:grid; place-items:center; z-index:50; }
  #login .box { background:#fff; padding:32px; border-radius:12px; width:340px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  #login h2 { margin:0 0 16px; color:var(--p); }
  #login input { width:100%; padding:11px; margin-bottom:12px; border:1px solid var(--line); border-radius:8px; }
  #login button { width:100%; background:var(--a); border:none; padding:11px; font-weight:700; border-radius:8px; cursor:pointer; }
  .warn { background:#fdeaea; color:#b42318; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  header.adm { background:var(--pd); color:#fff; padding:12px 22px; display:flex; justify-content:space-between; align-items:center; }
  header.adm .brand { font-weight:800; font-size:18px; letter-spacing:1px; }
  header.adm button { background:#fff; color:var(--p); border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; }
  .tabs { display:flex; gap:6px; padding:12px 22px 0; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tabs button { border:none; background:none; padding:10px 16px; cursor:pointer; font-weight:600; color:var(--mut); border-bottom:3px solid transparent; }
  .tabs button.active { color:var(--p); border-bottom-color:var(--a); }
  main { padding:22px; max-width:1100px; margin:0 auto; }
  h3 { color:var(--pd); margin:0 0 14px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  th, td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; vertical-align:top; }
  th { background:#eef2f8; color:var(--pd); }
  .btn { background:var(--a); border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; }
  .btn.d { background:#fdeaea; color:#b42318; }
  .btn.s { background:var(--p); color:#fff; }
  .btn.g { background:#e7f6ec; color:#1d7a3f; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:20px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  label { display:block; font-weight:600; font-size:13px; margin:10px 0 4px; }
  input, textarea, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  textarea { min-height:80px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:200px; }
  .muted { color:var(--mut); font-size:13px; }
  .pill { display:inline-block; background:#eef2f8; color:var(--p); padding:2px 8px; border-radius:20px; font-size:12px; }
  .ok { color:#1d7a3f; font-weight:700; }
  img.thumb { height:46px; border-radius:6px; object-fit:cover; }
</style>
</head>
<body>
  <div id="login">
    <div class="box">
      <h2>Admin Login</h2>
      <div id="serverWarn" class="warn hidden"></div>
      <input id="u" placeholder="Username" value="admin">
      <input id="pw" type="password" placeholder="Password" value="ADMIN336">
      <button id="loginBtn">Log in</button>
      <p class="muted" style="margin-top:10px">Default: admin / ADMIN336</p>
    </div>
  </div>

  <header class="adm hidden" id="admHeader">
    <div class="brand">ONEWORLD · Admin</div>
    <button id="logoutBtn">Logout</button>
  </header>
  <nav class="tabs hidden" id="tabs">
    <button data-tab="content" class="active">Content / Header / Footer</button>
    <button data-tab="banners">Banners</button>
    <button data-tab="blog">Blog</button>
    <button data-tab="products">Products</button>
    <button data-tab="quotes">Quotes (RFQ)</button>
    <button data-tab="messages">Messages</button>
  </nav>
  <main id="main" class="hidden"></main>

<script>
(function () {
  'use strict';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  let MEM_TOKEN = localStorage.getItem('ow_admin_token') || '';
  const apiFetch = async (url, opts = {}) => {
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (MEM_TOKEN) opts.headers['X-Admin-Token'] = MEM_TOKEN;
    let u = url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(MEM_TOKEN);
    const r = await fetch(u, opts);
    if (r.status === 401) { alert('Session expired, please login again.'); location.reload(); throw new Error('401'); }
    return r;
  };

  // boot check
  (function bootCheck() {
    fetch('/api/health').then(r => r.json()).then(j => {
      if (!j.ok) throw new Error('no health');
    }).catch(() => {
      const w = document.getElementById('serverWarn');
      w.classList.remove('hidden');
      w.innerHTML = '⚠️ Cannot reach the live server. Open this page from your deployed domain (e.g. your-site.vercel.app/admin), not the local file preview.';
    });
  })();

  // login
  document.getElementById('loginBtn').onclick = async () => {
    const u = document.getElementById('u').value, pw = document.getElementById('pw').value;
    const r = await fetch('/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username:u, password:pw }) });
    const j = await r.json();
    if (j.ok) {
      MEM_TOKEN = j.token; localStorage.setItem('ow_admin_token', MEM_TOKEN);
      document.getElementById('login').classList.add('hidden');
      ['admHeader','tabs','main'].forEach(id => document.getElementById(id).classList.remove('hidden'));
      loadTab('content');
    } else { alert('Wrong password.'); }
  };
  document.getElementById('logoutBtn').onclick = async () => {
    await fetch('/admin/logout', { method:'POST' });
    MEM_TOKEN = ''; localStorage.removeItem('ow_admin_token'); location.reload();
  };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); loadTab(b.dataset.tab);
  });

  const main = document.getElementById('main');
  async function loadTab(tab) {
    if (tab === 'content') return renderContent();
    if (tab === 'banners') return renderBanners();
    if (tab === 'blog') return renderBlog();
    if (tab === 'products') return renderProducts();
    if (tab === 'quotes') return renderQuotes();
    if (tab === 'messages') return renderMessages();
  }

  // ---------- Content (header/footer/sections) ----------
  async function renderContent() {
    const list = await (await apiFetch('/api/content')).json();
    let html = '<h3>Editable Content Blocks (header / footer / hero / about / factory / contact)</h3>';
    html += '<div class="panel"><p class="muted">Each block holds a title, text (body), an image URL and a link URL. The front-end reads these live.</p>';
    for (const b of list) {
      html += `<div class="panel" data-key="${esc(b.key)}">
        <div class="row"><div><label>Key</label><span class="pill">${esc(b.key)}</span></div>
        <div><label>Title</label><input data-f="title" value="${esc(b.title)}"></div></div>
        <label>Body / Text</label><textarea data-f="body">${esc(b.body)}</textarea>
        <div class="row"><div><label>Image URL</label><input data-f="image_url" value="${esc(b.image_url)}"></div>
        <div><label>Link URL</label><input data-f="link_url" value="${esc(b.link_url)}"></div></div>
        <button class="btn s" onclick="saveBlock('${esc(b.key)}')">Save</button>
        <span id="st_${esc(b.key)}"></span>
      </div>`;
    }
    html += '</div>';
    main.innerHTML = html;
  }
  window.saveBlock = async (key) => {
    const panel = document.querySelector(`[data-key="${key}"]`);
    const get = (f) => panel.querySelector(`[data-f="${f}"]`).value;
    const body = { key, title:get('title'), body:get('body'), image_url:get('image_url'), link_url:get('link_url') };
    const r = await apiFetch('/api/content', { method:'PUT', body: JSON.stringify(body) });
    const st = document.getElementById('st_' + key);
    st.textContent = r.ok ? ' ✓ saved' : ' ✗ failed'; st.className = r.ok ? 'ok' : '';
    setTimeout(() => st.textContent = '', 2000);
  };

  // ---------- Banners ----------
  async function renderBanners() {
    const list = await (await apiFetch('/api/banners')).json();
    let html = '<h3>Banners (home carousel)</h3><div class="panel"><h4>Add / Edit Banner</h4>';
    html += `<div class="row"><div><label>ID (leave for new)</label><input id="b_id" placeholder="auto"></div>
      <div><label>Title</label><input id="b_title"></div></div>
      <label>Image URL</label><input id="b_img">
      <label>Link URL</label><input id="b_link" placeholder="/#/products">
      <div class="row"><div><label>Sort order</label><input id="b_sort" type="number" value="0"></div>
      <div><label>Active</label><select id="b_active"><option value="true">Yes</option><option value="false">No</option></select></div></div>
      <button class="btn" onclick="saveBanner()">Add Banner</button></div>`;
    html += '<table><tr><th>Image</th><th>Title</th><th>Link</th><th>Sort</th><th>Active</th><th>Action</th></tr>';
    for (const b of list) {
      html += `<tr><td>${b.image_url?`<img class="thumb" src="${esc(b.image_url)}">`:''}</td>
        <td>${esc(b.title)}</td><td>${esc(b.link_url)}</td><td>${b.sort_order}</td><td>${b.active?'✅':'❌'}</td>
        <td><button class="btn d" onclick="delBanner('${esc(b.id)}')">Delete</button></td></tr>`;
    }
    html += '</table>';
    main.innerHTML = html;
  }
  window.saveBanner = async () => {
    const b = { title:document.getElementById('b_title').value, image_url:document.getElementById('b_img').value,
      link_url:document.getElementById('b_link').value, sort_order:Number(document.getElementById('b_sort').value)||0,
      active: document.getElementById('b_active').value === 'true' };
    const id = document.getElementById('b_id').value.trim(); if (id) b.id = id;
    await apiFetch('/api/banners', { method:'POST', body: JSON.stringify(b) }); renderBanners();
  };
  window.delBanner = async (id) => { if (confirm('Delete this banner?')) { await apiFetch('/api/banners/'+id, { method:'DELETE' }); renderBanners(); } };

  // ---------- Blog ----------
  async function renderBlog() {
    const list = await (await apiFetch('/api/blog')).json();
    let html = '<h3>Blog / News</h3><div class="panel"><h4>Add Post</h4>';
    html += `<label>Slug (unique, optional)</label><input id="p_slug" placeholder="my-post-title">
      <label>Title</label><input id="p_title">
      <label>Excerpt</label><textarea id="p_excerpt"></textarea>
      <label>Cover Image URL</label><input id="p_img">
      <label>Body</label><textarea id="p_body" style="min-height:160px"></textarea>
      <div class="row"><div><label>Published date</label><input id="p_date" type="date"></div>
      <div><label>Active</label><select id="p_active"><option value="true">Yes</option><option value="false">No</option></select></div></div>
      <button class="btn" onclick="savePost()">Add Post</button></div>`;
    html += '<table><tr><th>Cover</th><th>Title</th><th>Date</th><th>Active</th><th>Action</th></tr>';
    for (const p of list) {
      html += `<tr><td>${p.cover_image?`<img class="thumb" src="${esc(p.cover_image)}">`:''}</td>
        <td>${esc(p.title)}</td><td>${esc((p.published_at||'').slice(0,10))}</td><td>${p.active?'✅':'❌'}</td>
        <td><button class="btn d" onclick="delPost('${esc(p.id)}')">Delete</button></td></tr>`;
    }
    html += '</table>';
    main.innerHTML = html;
  }
  window.savePost = async () => {
    const date = document.getElementById('p_date').value || new Date().toISOString().slice(0,10);
    const p = { slug:document.getElementById('p_slug').value.trim(), title:document.getElementById('p_title').value,
      excerpt:document.getElementById('p_excerpt').value, cover_image:document.getElementById('p_img').value,
      body:document.getElementById('p_body').value, published_at:date, active: document.getElementById('p_active').value === 'true' };
    await apiFetch('/api/blog', { method:'POST', body: JSON.stringify(p) }); renderBlog();
  };
  window.delPost = async (id) => { if (confirm('Delete this post?')) { await apiFetch('/api/blog/'+id, { method:'DELETE' }); renderBlog(); } };

  // ---------- Products ----------
  async function renderProducts() {
    const list = await (await apiFetch('/api/products')).json();
    let html = '<h3>Products</h3><div class="panel"><h4>Add / Edit Product</h4>';
    html += `<div class="row"><div><label>ID (leave for new)</label><input id="pr_id" placeholder="auto"></div>
      <div><label>Name *</label><input id="pr_name"></div></div>
      <label>Description</label><textarea id="pr_desc"></textarea>
      <div class="row"><div><label>Image URL</label><input id="pr_img"></div>
      <div><label>Price</label><input id="pr_price" placeholder="optional"></div>
      <div><label>Sort</label><input id="pr_sort" type="number" value="0"></div></div>
      <button class="btn" onclick="saveProduct()">Add Product</button></div>`;
    html += '<table><tr><th>Image</th><th>Name</th><th>Description</th><th>Action</th></tr>';
    for (const p of list) {
      html += `<tr><td>${p.image?`<img class="thumb" src="${esc(p.image)}">`:''}</td>
        <td>${esc(p.name)}</td><td class="muted">${esc((p.desc||'').slice(0,60))}</td>
        <td><button class="btn d" onclick="delProduct('${esc(p.id)}')">Delete</button></td></tr>`;
    }
    html += '</table>';
    main.innerHTML = html;
  }
  window.saveProduct = async () => {
    const p = { name:document.getElementById('pr_name').value.trim(), desc:document.getElementById('pr_desc').value,
      image:document.getElementById('pr_img').value, price:document.getElementById('pr_price').value,
      sort_order:Number(document.getElementById('pr_sort').value)||0 };
    if (!p.name) return alert('Name is required');
    const id = document.getElementById('pr_id').value.trim(); if (id) p.id = id;
    await apiFetch('/api/products', { method:'POST', body: JSON.stringify(p) }); renderProducts();
  };
  window.delProduct = async (id) => { if (confirm('Delete this product?')) { await apiFetch('/api/products/'+id, { method:'DELETE' }); renderProducts(); } };

  // ---------- Quotes ----------
  async function renderQuotes() {
    const list = await (await apiFetch('/admin/api/quotes')).json();
    let html = '<h3>Buyer Quotes (RFQ)</h3>';
    html += `<p><a class="btn g" href="/admin/api/export/quotes?token=${encodeURIComponent(MEM_TOKEN)}">Export CSV</a></p>`;
    html += '<table><tr><th>Date</th><th>Name</th><th>Email</th><th>Company</th><th>Product</th><th>Message</th><th>Budget</th><th>Action</th></tr>';
    for (const q of list) {
      html += `<tr><td class="muted">${esc((q.createdAt||'').slice(0,10))}</td><td>${esc(q.name)}</td><td>${esc(q.email)}</td>
        <td>${esc(q.company||'')}</td><td>${esc(q.product||'')}</td><td class="muted">${esc((q.message||'').slice(0,40))}</td>
        <td>${esc(q.budget||'')}</td><td><button class="btn d" onclick="delQuote('${esc(q.id)}')">Delete</button></td></tr>`;
    }
    if (!list.length) html += '<tr><td colspan="8" class="muted">No quotes yet.</td></tr>';
    html += '</table>';
    main.innerHTML = html;
  }
  window.delQuote = async (id) => { if (confirm('Delete this quote?')) { await apiFetch('/admin/api/quotes/'+id, { method:'DELETE' }); renderQuotes(); } };

  // ---------- Messages ----------
  async function renderMessages() {
    const list = await (await apiFetch('/admin/api/messages')).json();
    let html = '<h3>Contact Messages</h3>';
    html += `<p><a class="btn g" href="/admin/api/export/messages?token=${encodeURIComponent(MEM_TOKEN)}">Export CSV</a></p>`;
    html += '<table><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Action</th></tr>';
    for (const m of list) {
      html += `<tr><td class="muted">${esc((m.createdAt||'').slice(0,10))}</td><td>${esc(m.name)}</td><td>${esc(m.email)}</td>
        <td>${esc(m.phone||'')}</td><td class="muted">${esc((m.message||'').slice(0,50))}</td>
        <td><button class="btn d" onclick="delMessage('${esc(m.id)}')">Delete</button></td></tr>`;
    }
    if (!list.length) html += '<tr><td colspan="6" class="muted">No messages yet.</td></tr>';
    html += '</table>';
    main.innerHTML = html;
  }
  window.delMessage = async (id) => { if (confirm('Delete this message?')) { await apiFetch('/admin/api/messages/'+id, { method:'DELETE' }); renderMessages(); } };
})();
</script>
</body>
</html>
