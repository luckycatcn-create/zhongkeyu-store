<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · zhongkeyu</title>
  <style>
    :root { --brand: #2563eb; --ink: #0f172a; --muted: #64748b; --bg: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", "Segoe UI", system-ui, Arial, sans-serif; color: var(--ink); background: var(--bg); }
    .wrap { width: min(1200px, 94vw); margin: 0 auto; padding: 28px 0 48px; }
    header.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    h1 { font-size: 1.4rem; margin: 0; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 1px solid #d6deea; background: #fff; cursor: pointer; }
    .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .count { background: #e7efff; color: var(--brand); font-weight: 700; padding: 2px 10px; border-radius: 999px; font-size: 0.85rem; }
    .card { background: #fff; border: 1px solid #eef2f7; border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,0.06); padding: 20px; margin-bottom: 18px; }
    .actions { display: flex; gap: 10px; }
    button, .btn { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 1px solid #d6deea; background: #fff; cursor: pointer; }
    button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .table-card { background: #fff; border: 1px solid #eef2f7; border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,0.06); overflow: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 920px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #eef2f7; vertical-align: top; }
    th { position: sticky; top: 0; background: #f8fafc; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    tr:hover td { background: #fafcff; }
    td.msg { max-width: 280px; white-space: pre-wrap; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 10px 0 4px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d6deea; border-radius: 10px; font: inherit; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    .prod-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 6px; }
    .prod-item { border: 1px solid #eef2f7; border-radius: 12px; padding: 12px; background: #fbfdff; }
    .prod-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: #f1f5f9; }
    .prod-item .pname { font-weight: 700; margin: 8px 0 2px; }
    .prod-item .pprice { color: var(--brand); font-weight: 700; }
    .prod-item .row { display: flex; gap: 8px; margin-top: 10px; }
    .hidden { display: none !important; }
    .imgprev { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .err { color: #dc2626; }

    /* Login overlay */
    #login { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: grid; place-items: center; z-index: 100; }
    #login .box { background: #fff; padding: 28px; border-radius: 14px; width: min(360px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    #login h2 { margin: 0 0 6px; }
    #login .err { min-height: 1.2em; margin: 8px 0 0; font-size: 0.85rem; }
    #login button { width: 100%; margin-top: 14px; }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login">
    <div class="box">
      <h2>Admin Login</h2>
      <p class="meta">Enter the admin password to manage messages &amp; products.</p>
      <div id="serverWarn" class="hidden" style="background:#fff4f4;border:1px solid #fecaca;color:#b91c1c;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:0.85rem;line-height:1.4"></div>
      <label>Username</label>
      <input id="lUser" value="admin" autocomplete="username" />
      <label>Password</label>
      <input id="lPass" type="password" autocomplete="current-password" placeholder="password: ADMIN336" />
      <p class="err" id="lErr"></p>
      <button class="primary" id="lBtn">Log in</button>
    </div>
  </div>

  <div class="wrap">
    <header class="bar">
      <div>
        <h1>zhongkeyu · Admin</h1>
        <div class="meta">Messages inbox &amp; product catalog manager.</div>
      </div>
      <div class="actions">
        <a class="btn" href="/">View Site</a>
        <button class="btn primary" id="exportBtn">Export Messages CSV</button>
        <button class="btn" id="logoutBtn">Log out</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="messages">Messages <span class="count" id="count">0</span></button>
      <button class="tab" data-tab="products">Products</button>
    </div>

    <section id="tab-messages">
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Time</th><th>Name</th><th>Email</th><th>Phone / WhatsApp</th>
              <th>Company</th><th>Country</th><th>Product</th><th>Budget</th><th>Message</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-products" class="hidden">
      <div class="card">
        <h3 id="prodFormTitle">Add Product</h3>
        <input type="hidden" id="pId" />
        <div class="form-grid">
          <div>
            <label>Name *</label>
            <input id="pName" placeholder="e.g. Wireless Earbuds Pro" />
          </div>
          <div>
            <label>Price</label>
            <input id="pPrice" placeholder="e.g. from $6.9/unit" />
          </div>
          <div class="full">
            <label>Description</label>
            <input id="pDesc" placeholder="e.g. ANC, 32h battery, IPX5" />
          </div>
          <div class="full">
            <label>Image</label>
            <input id="pImageFile" type="file" accept="image/*" />
            <div class="imgprev" id="pImgPrev"></div>
          </div>
        </div>
        <div class="actions" style="margin-top:14px">
          <button class="primary" id="pSave">Save Product</button>
          <button id="pCancel" class="hidden">Cancel</button>
        </div>
        <p id="pStatus" class="meta"></p>
      </div>
      <h3>Current Catalog</h3>
      <div class="prod-list" id="prodList"></div>
    </section>
  </div>

  <script>
    // Surface any script error on the page instead of failing silently.
    window.addEventListener('error', function (ev) {
      var b = document.getElementById('lErr');
      if (b) b.textContent = '页面脚本出错：' + (ev.message || (ev.error && ev.error.message) || 'unknown');
    });

    // ---------- Auth (cookie + token; proxy-safe) ----------
    // Use an in-memory token as the primary store so login still works even if
    // the embedded/preview browser blocks localStorage/sessionStorage access
    // (a common cause of "login returns ok but the UI never updates").
    let MEM_TOKEN = '';
    const TOKEN_KEY = 'zhongkeyu_admin_token';
    function getToken() {
      try {
        if (MEM_TOKEN) return MEM_TOKEN;
        if (typeof localStorage !== 'undefined') return localStorage.getItem(TOKEN_KEY) || '';
      } catch (e) {}
      return MEM_TOKEN;
    }
    function setToken(t) {
      MEM_TOKEN = t || '';
      try {
        if (typeof localStorage !== 'undefined') {
          if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY);
        }
      } catch (e) {}
    }

    function showLogin(msg) {
      document.getElementById('login').classList.remove('hidden');
      if (msg) document.getElementById('lErr').textContent = msg;
    }
    function hideLogin() { document.getElementById('login').classList.add('hidden'); }

    document.getElementById('lBtn').addEventListener('click', doLogin);
    document.getElementById('lPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    async function doLogin() {
      const u = document.getElementById('lUser').value.trim() || 'admin';
      const p = document.getElementById('lPass').value;
      if (!p) { document.getElementById('lErr').textContent = 'Password required.'; return; }
      document.getElementById('lErr').textContent = '';
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          setToken(data.token);
          document.getElementById('lPass').value = '';
          hideLogin();
          loadMessages();
          if (document.querySelector('.tab.active') && document.querySelector('.tab.active').dataset.tab === 'products') loadProducts();
        } else {
          document.getElementById('lErr').textContent = 'Wrong password.';
        }
      } catch (e) {
        document.getElementById('lErr').textContent = 'Cannot reach server. Open this page from the live site (http://localhost:8787/admin), not the static preview.';
      }
    }
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      setToken('');
      try { await fetch('/admin/logout', { method: 'POST' }); } catch (e) {}
      showLogin('Logged out.');
    });

    // Fetch wrapper — attaches the session token BOTH as a header and as a URL
    // query param. Some embedded/preview browsers strip custom headers, so the
    // query param is the reliable fallback.
    async function apiFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers);
      const t = getToken();
      if (t) {
        opts.headers['X-Admin-Token'] = t;
        const sep = url.includes('?') ? '&' : '?';
        url = url + sep + 'token=' + encodeURIComponent(t);
      }
      const res = await fetch(url, opts);
      if (res.status === 401) { setToken(''); showLogin('Session expired or wrong password.'); throw new Error('unauthorized'); }
      return res;
    }

    // ---------- Tabs ----------
    document.querySelectorAll('.tab').forEach((t) => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
        t.classList.add('active');
        const tab = t.dataset.tab;
        document.getElementById('tab-messages').classList.toggle('hidden', tab !== 'messages');
        document.getElementById('tab-products').classList.toggle('hidden', tab !== 'products');
        if (tab === 'products') loadProducts();
      });
    });

    // ---------- Messages ----------
    const fmt = (iso) => { try { return new Date(iso).toLocaleString(); } catch { return iso || ''; } };
    async function loadMessages() {
      try {
        const res = await apiFetch('/admin/api/messages');
        const data = await res.json();
        document.getElementById('count').textContent = data.length;
        const rows = document.getElementById('rows');
        if (!data.length) { rows.innerHTML = '<tr><td colspan="9" class="empty">No messages yet.</td></tr>'; return; }
        rows.innerHTML = data.map((m) => `
          <tr>
            <td>${fmt(m.createdAt)}</td><td>${m.name || ''}</td>
            <td><a href="mailto:${m.email}">${m.email || ''}</a></td><td>${m.phone || ''}</td>
            <td>${m.company || '—'}</td><td>${m.country || '—'}</td>
            <td>${m.product || '—'}</td><td>${m.budget || '—'}</td>
            <td class="msg">${m.message || ''}</td>
          </tr>`).join('');
      } catch (e) { if (e.message !== 'unauthorized') document.getElementById('rows').innerHTML = '<tr><td colspan="9" class="empty err">Failed to load messages.</td></tr>'; }
    }

    // Export via authenticated download
    document.getElementById('exportBtn').addEventListener('click', async () => {
      try {
        const res = await apiFetch('/admin/api/export');
        const text = await res.text();
        const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'messages.csv'; a.click();
        URL.revokeObjectURL(url);
      } catch (e) { /* handled by apiFetch */ }
    });

    // ---------- Products ----------
    let pendingImage = '';
    document.getElementById('pImageFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) { pendingImage = ''; document.getElementById('pImgPrev').textContent = ''; return; }
      const reader = new FileReader();
      reader.onload = () => { pendingImage = reader.result; document.getElementById('pImgPrev').textContent = 'Image loaded (' + Math.round(reader.result.length / 1024) + ' KB).'; };
      reader.readAsDataURL(file);
    });

    async function loadProducts() {
      try {
        const res = await fetch('/api/products'); // public
        const list = await res.json();
        const box = document.getElementById('prodList');
        if (!list.length) { box.innerHTML = '<p class="meta">No products yet.</p>'; return; }
        box.innerHTML = list.map((p) => `
          <div class="prod-item">
            ${p.image ? `<img src="${p.image}" alt="${p.name}" />` : '<div style="height:120px;display:grid;place-items:center;background:#f1f5f9;border-radius:8px">📦</div>'}
            <div class="pname">${p.name}</div>
            <div class="meta">${p.desc || ''}</div>
            <div class="pprice">${p.price || ''}</div>
            <div class="row">
              <button data-edit="${p.id}">Edit</button>
              <button data-del="${p.id}">Delete</button>
            </div>
          </div>`).join('');
        box.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => editProduct(b.dataset.edit, list)));
        box.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => delProduct(b.dataset.del)));
      } catch (e) { document.getElementById('prodList').innerHTML = '<p class="meta err">Failed to load products.</p>'; }
    }

    function editProduct(id, list) {
      const p = list.find((x) => x.id === id);
      if (!p) return;
      document.getElementById('pId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pPrice').value = p.price || '';
      document.getElementById('pDesc').value = p.desc || '';
      pendingImage = p.image || '';
      document.getElementById('pImgPrev').textContent = p.image ? 'Keep existing image (re-select to replace).' : '';
      document.getElementById('prodFormTitle').textContent = 'Edit Product';
      document.getElementById('pCancel').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('pCancel').addEventListener('click', resetProdForm);
    function resetProdForm() {
      document.getElementById('pId').value = '';
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pImageFile').value = '';
      pendingImage = '';
      document.getElementById('pImgPrev').textContent = '';
      document.getElementById('prodFormTitle').textContent = 'Add Product';
      document.getElementById('pCancel').classList.add('hidden');
    }

    document.getElementById('pSave').addEventListener('click', async () => {
      const status = document.getElementById('pStatus');
      const name = document.getElementById('pName').value.trim();
      if (!name) { status.textContent = 'Name is required.'; status.className = 'meta err'; return; }
      const body = {
        id: document.getElementById('pId').value || undefined,
        name,
        desc: document.getElementById('pDesc').value.trim(),
        price: document.getElementById('pPrice').value.trim(),
        image: pendingImage,
      };
      try {
        const res = await apiFetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const out = await res.json();
        if (res.ok && out.ok) {
          status.textContent = 'Saved ✓'; status.className = 'meta';
          resetProdForm(); loadProducts();
        } else {
          status.textContent = out.error || 'Save failed.'; status.className = 'meta err';
        }
      } catch (e) {
        if (e.message !== 'unauthorized') { status.textContent = 'Network error — are you on the live site?'; status.className = 'meta err'; }
      }
    });

    async function delProduct(id) {
      if (!confirm('Delete this product?')) return;
      try { await apiFetch('/api/products/' + id, { method: 'DELETE' }); loadProducts(); }
      catch (e) { /* handled */ }
    }

    // ---------- Boot ----------
    // Self-check: is this page actually served by the live Node server?
    (function bootCheck() {
      const warn = (msg) => {
        const w = document.getElementById('serverWarn');
        w.classList.remove('hidden');
        w.innerHTML = msg;
      };
      fetch('/api/products')
        .then((r) => {
          const ct = r.headers.get('content-type') || '';
          if (!(r.ok && ct.includes('application/json'))) {
            warn('⚠️ This page is <b>not</b> running on the live server, so login &amp; upload will not work.<br>Open <b>http://localhost:8787/admin</b> in your browser — the address must start with <b>localhost:8787</b>, not <b>static-html</b>.');
          }
        })
        .catch(() => {
          warn('⚠️ Cannot reach the server. Open <b>http://localhost:8787/admin</b> in your browser (not the file/static preview).');
        });
    })();

    // Boot: if we already have a session token, try to resume; otherwise just show login.
    (async function boot() {
      if (!getToken()) { showLogin(); return; }
      try {
        const r = await apiFetch('/admin/api/messages');
        if (r.ok) { hideLogin(); loadMessages(); }
        else { setToken(''); showLogin(); }
      } catch { setToken(''); showLogin(); }
    })();
  </script>
</body>
</html>
